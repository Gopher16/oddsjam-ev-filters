name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: python -m pip install 'poetry>=2,<3'

      - name: Install locked dependencies
        run: poetry install --with dashboard --no-interaction --no-ansi --sync

      - name: Validate dependency lock
        run: poetry check --lock

      - name: Ruff lint (including notebooks)
        run: poetry run ruff check . --output-format=github

      - name: Ruff format (including notebooks)
        run: poetry run ruff format --check .

  documentation:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check tracked local links and presentation offline
        run: python scripts/check_documentation.py

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: python -m pip install 'poetry>=2,<3'

      - name: Install locked dependencies
        run: poetry install --with dashboard --no-interaction --no-ansi --sync

      - name: Check allowlisted CLI help interfaces offline
        run: poetry run python scripts/check_documentation.py --check-cli

      - name: Run unit tests
        run: poetry run pytest -q
