schema_version: 1
snapshot_date: '2026-10-22'
source: 'User-supplied OddsJam UI screenshots and clarifications'
notes:
  - 'This is a historical configuration registry, not an execution engine or source of truth for betting returns.'
  - 'Unselected settings are null, not zero; displayed inactive UI defaults are not enforced.'
  - 'PROD means currently used for real-money opportunity discovery, not independently validated profitability.'
  - 'OddsJam Next 24 hours / Next 7 days refer to event horizons, not historical lookback.'
  - 'Maintain effective-dated snapshots and name aliases rather than overwriting historical settings.'
