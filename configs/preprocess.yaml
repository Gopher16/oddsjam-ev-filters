# ==============================================================================
# OddsJam Bet Tracker Preprocessing Config (preprocess.yaml)
# ==============================================================================
# Purpose
# -------
# This config drives scripts/preprocess_bet_tracker.py which:
#   - loads an OddsJam Bet Tracker CSV export
#   - standardizes timestamps to America/New_York
#   - applies optional date cutoffs and filter-name normalization
#   - adds regime-aware feature engineering
#       * regime tagging (exchange vs sportsbook)
#       * has_liquidity flag (True only where liquidity is expected by design)
#       * prod_filter binary flag for configured production filters
#       * opportunity_id for future opportunity-level dedupe / aggregation
#       * liquidity buckets (exchange-aware; bucket-based because raw liquidity
#         is currently unusable in the OddsJam Bet Tracker export)
#       * time-to-event buckets
#       * EV / ROI fields
#   - generates QA artifacts
#       * field validation
#       * duplicate audits
#       * liquidity metadata
#       * status / settlement summaries
#   - writes:
#       (a) a "processed" parquet (canonical dataset)
#       (b) an optional "settled-only" parquet
#
# Key Concepts
# ------------
# 1) Canonical Processed Dataset
#    The processed parquet is the main analysis-ready dataset and, by default,
#    preserves all rows unless status_settlement.exclude_statuses_from_processed
#    is enabled.
#
# 2) Regime Tagging
#    A "regime" column distinguishes between:
#      - exchange    -> true market / order-book style platforms
#      - sportsbook  -> traditional sportsbooks / books without true liquidity depth
#
#    This is important because liquidity should NOT be interpreted globally.
#    Missing liquidity is expected for sportsbook rows and is not a data-quality issue.
#
# 3) Production Filter Tagging
#    A config-driven "prod_filter" column allows you to explicitly list the
#    filters that are considered live / production in downstream research.
#
#    This makes it easy to:
#      - separate real-money vs test filters
#      - slice reports by production status
#      - build downstream promotion / demotion workflows
#
# 4) Liquidity Expectations
#    Liquidity is only expected for configured exchange regimes.
#
#    Important current constraint:
#      - the raw OddsJam Bet Tracker "liquidity" column is currently treated as
#        unusable / untrusted
#      - therefore exchange liquidity interpretation is based on the derived
#        liquidity_bucket column instead
#
#    Therefore:
#      - exchange rows may be analyzed by liquidity bucket
#      - sportsbook rows are allowed to have null liquidity by design
#
#    Any liquidity metadata / coverage statistics should be interpreted ONLY within
#    the regimes listed under liquidity.apply_to_regimes.
#
# 5) Opportunity-Level Identity
#    The config can add an "opportunity_id" column, built from a set of identity fields
#    such as game_id / event_name / market_name / bet_name.
#
#    This does NOT deduplicate rows by default.
#    It exists so downstream notebooks / evaluation code can compare:
#      - execution-level performance (true bankroll result)
#      - opportunity-level performance (true edge detection)
#
# 6) Status Behavior
#    Status handling remains intentionally split into TWO independent controls:
#      (a) status_settlement.exclude_statuses_for_settled_inference
#          statuses excluded ONLY from settlement inference logic
#      (b) status_settlement.exclude_statuses_from_processed
#          optional toggle to drop unresolved statuses from the processed output too
#
# 7) Liquidity Buckets
#    The preprocessing script can produce a condensed liquidity scheme for analysis.
#    Because the raw liquidity column is currently unusable, the liquidity bucket is
#    the canonical downstream capacity signal for exchange rows.
#
#    Bucket labels and edges are controlled entirely here, so the scheme can be
#    changed without touching code.
#
# 8) Bucket-Based Capacity Proxy
#    This config can define representative dollar values for each liquidity bucket.
#    Downstream exchange-capacity logic may use these representative values as a
#    capacity proxy in the absence of usable raw numeric liquidity.
#
# Notes on Backwards Compatibility
# --------------------------------
# - Older configs may reference event / market instead of event_name / market_name.
# - Older configs may reference event_id / event instead of game_id / event_name.
# - Older configs used status_settlement.exclude_statuses for inference.
#   That key may still be tolerated in code for backwards compatibility, but the
#   clearer split keys below are preferred.
#
# Commit Context
# --------------
# This version corresponds to the commit:
#
#   git commit -m "Add prod filter tagging and bucket-based exchange capacity"
#
# Main additions in this version:
#   - prod_filters block
#   - liquidity.raw_liquidity_usable flag
#   - liquidity bucket-based coverage semantics
#   - bucket representative values for downstream exchange-capacity analysis
# ==============================================================================

raw_csv_path: data/raw/oddsjam-bet-tracker-03-21-2026.csv
output_dir: data/processed
artifacts_dir: data/processed/artifacts

# Optional; if omitted, script may auto-stamp
# run_id: 2026-03-21

# Optional: only keep rows on/after this date
cutoff_date: "2025-03-22"

timestamps:
  src_col: created_at
  out_col: created_at_et

  # Raw CSV timestamps are assumed to already represent ET / America/New_York
  # when tz-naive. The script should localize rather than convert.
  assume_tz_for_naive: America/New_York

  # Optional convenience compatibility column
  also_write_created_at_est: true

filters:
  filter_col: saved_filter_names
  null_label: "No Filter"

  fantasy_optimizer_fill:
    enabled: false
    stake_col: stake
    max_stake: 20
    label: "TEST - Fantasy Optimizer"

# ------------------------------------------------------------------------------
# Production filter tagging
# ------------------------------------------------------------------------------
# Adds a binary prod/non-prod flag for downstream reporting and decision support.
# This should reflect your currently live / real-money filters.
prod_filters:
  enabled: true
  filter_col: saved_filter_names
  out_col: prod_filter

  # Exact filter names considered production.
  production_filters:
    - "PROD - Exchanges: Core Exchange Conservative (Low Risk, Slow Build)"
    - "PROD - Offshore Books: Core & Conservative (Low Risk, Slow Build)"

# ------------------------------------------------------------------------------
# Regime tagging
# ------------------------------------------------------------------------------
# Distinguishes exchange-style market platforms from traditional sportsbooks.
# This is used downstream for:
#   - exchange-only liquidity interpretation
#   - regime-aware evaluation tables
#   - capacity analysis on exchanges
regime:
  sportsbook_col: sportsbook
  out_col: regime
  has_liquidity_col: has_liquidity

  # These names should match sportsbook values in the processed dataframe.
  # Update this list whenever you add a new exchange / market venue.
  exchange_books:
    - Novig
    - Prophet X
    - Prophet Exchange
    - 4Cx
    - Kalshi
    - Robinhood

# ------------------------------------------------------------------------------
# Opportunity-level identifier
# ------------------------------------------------------------------------------
# Adds an identifier for "the same underlying bet opportunity".
# This is intended for downstream dedupe / aggregation and does NOT dedupe rows
# inside preprocessing by default.
opportunity:
  enabled: true
  out_col: opportunity_id

  # The script should concatenate whichever of these fields actually exist.
  # This list is intentionally resilient to slightly different exports.
  identity_cols:
    - game_id
    - event_name
    - market_name
    - bet_name

# ------------------------------------------------------------------------------
# Liquidity
# ------------------------------------------------------------------------------
# Liquidity is only meaningful / expected on exchange-style venues.
# Sportsbook rows are allowed to have null liquidity without being treated as
# missing-data failures.
#
# Important current export constraint:
#   - the raw `liquidity` column from OddsJam Bet Tracker is currently treated as
#     unusable / untrusted
#   - downstream exchange-capacity logic should therefore rely on the derived
#     `liquidity_bucket` rather than raw numeric liquidity
liquidity:
  liquidity_col: liquidity
  tags_col: tags
  out_bucket_col: liquidity_bucket

  # Raw numeric liquidity currently not trusted in the source export.
  raw_liquidity_usable: false

  # Only these regimes are expected to carry liquidity / liquidity buckets.
  # QA coverage should be interpreted within these regimes only.
  apply_to_regimes:
    - exchange

  # Condensed bucketing config used for analysis notebooks
  condensed:
    enabled: true

    # Buckets:
    #   (-inf..500], (500..1000], (1000..2000], (2000..5000],
    #   (5000..10000], (10000..inf)
    labels: ["<=500", "500-1k", "1k-2k", "2k-5k", "5k-10k", ">10k"]
    edges: [-inf, 500, 1000, 2000, 5000, 10000, inf]

  # Representative values for bucket-based capacity proxy logic downstream.
  # These do NOT affect bucketing itself; they exist to help downstream analysis
  # convert liquidity_bucket into a conservative numeric proxy.
  bucket_representative_values:
    "<=500": 250
    "500-1k": 750
    "1k-2k": 1500
    "2k-5k": 3500
    "5k-10k": 7500
    ">10k": 10000

# ------------------------------------------------------------------------------
# Time-to-event bucketing
# ------------------------------------------------------------------------------
# Buckets event_start_date - created_at_et.
time_to_event:
  enabled: true
  created_col: created_at_et
  event_start_col: event_start_date
  out_col: time_to_event_bucket
  tz: America/New_York

  # Bets placed after event start (negative delta) receive this label
  label_after_start: after_start

# ------------------------------------------------------------------------------
# QA / field validation / duplicate audits
# ------------------------------------------------------------------------------
qa:
  stake_col: stake
  odds_col: odds
  profit_col: bet_profit

  duplicate_keys:
    - ["id"]
    - ["bet_id"]
    - ["sportsbook", "created_at_et", "stake", "odds", "bet_profit"]

    # More semantic duplicate schemes; column availability may vary by export
    - ["sportsbook", "event_name", "market_name", "bet_name", "odds", "stake"]
    - ["sportsbook", "game_id", "market_name", "bet_name", "odds", "stake"]
    - ["sportsbook", "league", "sport", "market_name", "bet_name", "odds", "stake"]
    - ["sportsbook", "bet_name", "market_name", "odds", "stake", "created_at_et"]
    - ["sportsbook", "bet_name", "market_name", "odds", "stake"]

# ------------------------------------------------------------------------------
# Artifact-only dedupe controls
# ------------------------------------------------------------------------------
# OFF by default.
# This is for generating optional deduped artifacts later without changing the
# canonical processed parquet behavior.
dedupe_artifacts:
  enabled: false
  strategy: earliest        # earliest | latest | max_stake
  scope: within_filter      # within_filter | across_filters
  time_col: created_at_et
  stake_col: stake
  filter_col: saved_filter_names

  # Identity fields for optional artifact dedupe.
  # Keep this robust to export differences.
  identity_cols:
    - sportsbook
    - game_id
    - event_name
    - league
    - sport
    - market_name
    - bet_name
    - selection
    - odds
    - line

# ------------------------------------------------------------------------------
# EV feature engineering
# ------------------------------------------------------------------------------
ev_features:
  enabled: true
  odds_col: odds
  clv_col: clv
  stake_col: stake

# ------------------------------------------------------------------------------
# Status / settlement inference
# ------------------------------------------------------------------------------
status_settlement:
  enabled: true
  status_col: status
  stake_col: stake
  profit_col: bet_profit
  profit_known_threshold: 0.95

  # Used ONLY when inferring settled statuses
  exclude_statuses_for_settled_inference: ["pending", "open", "unsettled"]

  # If true, also exclude unresolved statuses from the processed parquet
  # If false, processed parquet keeps all rows and only the settled parquet is filtered
  exclude_statuses_from_processed: true

# ------------------------------------------------------------------------------
# Output stamping
# ------------------------------------------------------------------------------
as_of_date: "03-21-2026"  # MM-DD-YYYY

output:
  name_template: "oddsjam-bet-tracker-processed-{as_of_date}.parquet"

  # Optional convenience file for notebooks (set null to disable)
  stable_name: "oddsjam-bet-tracker-processed-latest.parquet"

  # Optional settled-only parquet (set null / omit to disable)
  settled_name_template: "oddsjam-bet-tracker-settled-{as_of_date}.parquet"